<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcommerceG 助手</title>
  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <style>
    :root {
      --bg: #f2efe8;
      --panel: #fffdf8;
      --ink: #1f2937;
      --muted: #6b7280;
      --brand: #c2410c;
      --brand-soft: #ffedd5;
      --line: #eadbc8;
      --user: #1f2937;
      --user-text: #f8fafc;
      --bot: #fff7ed;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #fde68a 0%, transparent 30%),
        radial-gradient(circle at 90% 80%, #fecaca 0%, transparent 28%),
        var(--bg);
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #fff8f0 0%, #fffdf8 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .new-chat-btn {
      border: none;
      background: var(--brand);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .new-chat-btn:hover { transform: translateY(-1px); }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }

    .session-item {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all .2s ease;
    }

    .session-item.active {
      background: var(--brand-soft);
      border-color: #fdba74;
    }

    .session-title {
      font-size: 14px;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 170px;
    }

    .del-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #9a3412;
      border-radius: 8px;
      font-size: 12px;
      padding: 4px 6px;
      cursor: pointer;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #fffdf8cc;
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .chat-title { font-size: 18px; font-weight: 700; }

    #dialog-area {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: min(820px, 90%);
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.6;
      animation: rise .25s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
    }

    .bot-message {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid #fed7aa;
    }

    .input-wrap {
      border-top: 1px solid var(--line);
      background: #fffdf8;
      padding: 14px 18px;
    }

    .input-box {
      max-width: 980px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(120, 53, 15, 0.08);
      padding: 10px;
    }

    #user-input {
      width: 100%;
      border: none;
      resize: none;
      outline: none;
      font-size: 15px;
      line-height: 1.5;
      max-height: 180px;
      min-height: 40px;
      font-family: inherit;
      color: var(--ink);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
    }

    .send-btn {
      border: none;
      background: var(--brand);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .markdown-content p { margin: 0.3em 0; }
    .markdown-content code { background: #f1f5f9; padding: 0.15em 0.35em; border-radius: 4px; }
    .markdown-content pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 10px; overflow: auto; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
      #dialog-area { padding: 16px; }
      .message { max-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">EcommerceG Assistant</div>
      <button class="new-chat-btn" id="new-chat-btn">+ 新建会话</button>
      <div class="session-list" id="session-list"></div>
    </aside>

    <main class="main">
      <div class="chat-head">
        <div class="chat-title" id="chat-title">会话</div>
      </div>

      <div id="dialog-area"></div>

      <div class="input-wrap">
        <div class="input-box">
          <textarea id="user-input" placeholder="输入问题，回车发送，Shift+Enter 换行"></textarea>
          <div class="actions">
            <span class="hint">会话已隔离存储在 Redis</span>
            <button class="send-btn" id="send-btn">发送</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const dialogArea = document.getElementById('dialog-area');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const sessionListEl = document.getElementById('session-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const chatTitleEl = document.getElementById('chat-title');

    let currentSessionId = null;
    let sessions = [];

    marked.setOptions({ breaks: false });

    function scrollBottom() {
      dialogArea.scrollTop = dialogArea.scrollHeight;
    }

    function renderMarkdown(el, text) {
      const dirty = marked.parse(text || '');
      el.innerHTML = DOMPurify.sanitize(dirty, {
        ADD_TAGS: ['iframe'],
        ADD_ATTR: ['allowfullscreen']
      });
    }

    function createMessage(content, role) {
      const bubble = document.createElement('div');
      bubble.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
      if (role === 'user') {
        bubble.textContent = content;
      } else {
        const m = document.createElement('div');
        m.className = 'markdown-content';
        renderMarkdown(m, content);
        bubble.appendChild(m);
      }
      dialogArea.appendChild(bubble);
      scrollBottom();
      return bubble;
    }

    async function loadSessions() {
      const res = await fetch('/api/sessions');
      const data = await res.json();
      sessions = data.sessions || [];

      if (!sessions.length) {
        const created = await createSession();
        sessions = [created];
      }

      renderSessionList();

      if (!currentSessionId || !sessions.find(s => s.session_id === currentSessionId)) {
        await switchSession(sessions[0].session_id);
      }
    }

    function renderSessionList() {
      sessionListEl.innerHTML = '';
      sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `session-item ${session.session_id === currentSessionId ? 'active' : ''}`;

        const title = document.createElement('div');
        title.className = 'session-title';
        title.textContent = session.title || '新会话';

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '删除';
        del.onclick = async (e) => {
          e.stopPropagation();
          await deleteSession(session.session_id);
        };

        item.appendChild(title);
        item.appendChild(del);
        item.onclick = () => switchSession(session.session_id);
        sessionListEl.appendChild(item);
      });
    }

    async function createSession() {
      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: '新会话' })
      });
      return await res.json();
    }

    async function deleteSession(sessionId) {
      await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
      sessions = sessions.filter(s => s.session_id !== sessionId);

      if (!sessions.length) {
        const created = await createSession();
        sessions = [created];
      }

      if (currentSessionId === sessionId) {
        currentSessionId = sessions[0].session_id;
      }

      renderSessionList();
      await switchSession(currentSessionId);
    }

    async function switchSession(sessionId) {
      currentSessionId = sessionId;
      renderSessionList();

      const target = sessions.find(s => s.session_id === sessionId);
      chatTitleEl.textContent = target?.title || '会话';

      dialogArea.innerHTML = '';
      const res = await fetch(`/api/sessions/${sessionId}/messages`);
      const data = await res.json();
      const messages = data.messages || [];

      if (!messages.length) {
        createMessage('您好，我是电商图谱助手。当前会话已隔离，您可以放心提问。', 'assistant');
        return;
      }

      messages.forEach(msg => createMessage(msg.content, msg.role));
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || !currentSessionId) return;

      sendBtn.disabled = true;
      createMessage(message, 'user');
      input.value = '';
      input.style.height = 'auto';

      const botBubble = document.createElement('div');
      botBubble.className = 'message bot-message';
      const botMd = document.createElement('div');
      botMd.className = 'markdown-content';
      botBubble.appendChild(botMd);
      dialogArea.appendChild(botBubble);
      scrollBottom();

      let responseText = '';
      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, session_id: currentSessionId })
        });

        if (!response.ok || !response.body) throw new Error('stream error');

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          if (chunk) {
            responseText += chunk;
            botMd.textContent = responseText;
            scrollBottom();
          }
        }
      } catch (err) {
        responseText = '系统暂时无法响应，请稍后再试。';
      }

      renderMarkdown(botMd, responseText);
      sendBtn.disabled = false;

      await loadSessions();
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    newChatBtn.addEventListener('click', async () => {
      const created = await createSession();
      sessions.unshift(created);
      renderSessionList();
      await switchSession(created.session_id);
    });

    loadSessions();
  </script>
</body>

</html>
